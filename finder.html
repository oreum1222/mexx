<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>학생에게 필요한 겨울 강의 찾기 | 김가경 국어 · MEXX</title>
<meta name="description" content="예비 고2 겨울, 간단한 질문을 하나씩 따라 내려오면 학생에게 필요한 국어 강의가 나옵니다."/>
<meta property="og:title" content="학생에게 필요한 겨울 강의 찾기"/>
<meta property="og:description" content="간단한 질문을 따라 내려오면 학생에게 필요한 겨울 국어 강의가 나옵니다."/>
<link rel="icon" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{ --bg:#060607; --ink:#f6f6f4; --muted:#8f8f8c; --line:rgba(255,255,255,.1); --card:#0c0d11; --p:0; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:clip;}
  a{color:inherit;}
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;
     background:
       radial-gradient(130% 90% at 50% calc(-20% + var(--p)*70%), rgba(34,40,56,.55), rgba(34,40,56,0) 55%),
       linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,calc(.15 + var(--p)*.55)) 100%);
     transition:background 1.1s ease;}
  .wrap{position:relative;z-index:1;width:100%;max-width:600px;margin:0 auto;padding:0 22px;}
  .top{position:sticky;top:0;z-index:20;background:rgba(6,6,7,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:860px;}
  .logo{font-weight:900;letter-spacing:-.02em;font-size:18px;text-decoration:none;}
  .logo b{color:var(--muted);font-weight:600;font-size:13px;margin-left:7px;}
  .back{text-decoration:none;font-size:14px;font-weight:600;color:#cfcfcb;border:1px solid var(--line);border-radius:10px;padding:9px 15px;}
  .hero{padding:48px 0 4px;text-align:center;}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:#cfcfcb;border:1px solid var(--line);border-radius:999px;padding:7px 14px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 0 rgba(255,255,255,.5);animation:ping 2.6s ease-out infinite;}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45);}70%,100%{box-shadow:0 0 0 9px rgba(255,255,255,0);}}
  h1{font-size:clamp(27px,5vw,40px);font-weight:900;letter-spacing:-.035em;line-height:1.16;margin:18px 0 0;word-break:keep-all;}
  .hero .sub{font-size:15px;color:#b0b0ac;margin:13px auto 0;max-width:430px;line-height:1.7;word-break:keep-all;}
  .nb{display:inline-block;white-space:nowrap;}
  #stage{position:relative;padding:26px 0 10px;}
  #spine{position:absolute;left:11px;top:34px;bottom:30px;width:2px;background:rgba(255,255,255,.06);overflow:hidden;}
  #spineFill{position:absolute;left:0;top:0;width:100%;height:calc(var(--p)*100%);
     background:linear-gradient(180deg,rgba(246,246,244,.0),rgba(246,246,244,.75));transition:height .7s cubic-bezier(.22,1,.36,1);}
  #flow{position:relative;padding-left:0;}
  .rung{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 38px;margin-bottom:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;opacity:.62;transition:opacity .35s,border-color .2s,transform .35s;}
  .rung:hover{opacity:1;border-color:rgba(255,255,255,.26);}
  .rung::before{content:"";position:absolute;left:4px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--bg);}
  .rung .rq{font-size:12.5px;color:#8f8f8c;flex:1;min-width:0;word-break:keep-all;}
  .rung .ra{font-size:14px;font-weight:800;white-space:nowrap;}
  .rung .redo{font-size:11px;color:#6d6d6a;white-space:nowrap;}
  .ask{position:relative;margin-left:24px;background:linear-gradient(180deg,#121420,#0b0c11);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:26px 22px;box-shadow:0 36px 90px rgba(0,0,0,.5);}
  .ask::before{content:"";position:absolute;left:-18px;top:30px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 18px 2px rgba(255,255,255,.4),0 0 0 4px var(--bg);}
  .ask.enter{animation:askin .55s cubic-bezier(.22,1,.36,1) both;}
  @keyframes askin{from{opacity:0;transform:translateY(30px) scale(.985);}to{opacity:1;transform:none;}}
  .ask.leaving{animation:askout .36s ease forwards;}
  @keyframes askout{to{opacity:0;transform:translateY(-8px);max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0;}}
  .ask .qn{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:#8f8f8c;letter-spacing:.08em;}
  .ask h2{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.4;margin:9px 0 2px;word-break:keep-all;}
  .ask .hint{font-size:13.5px;color:#9a9a96;margin:6px 0 0;line-height:1.6;word-break:keep-all;}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:18px;}
  .opt{text-align:left;width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--ink);font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .18s,background .18s,transform .12s,opacity .3s;}
  .opt:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.07);}
  .opt .od{font-size:12.5px;font-weight:500;color:#8f8f8c;}
  .opt .ar{color:#6d6d6a;font-size:17px;}
  .opt:hover .ar{color:var(--ink);}
  .opt.chosen{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.12);}
  .opts.collapsing .opt:not(.chosen){opacity:0;transform:translateY(-4px);}
  #veil{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(5,5,7,.86);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;}
  #veil.on{opacity:1;visibility:visible;}
  #veil .vt{font-size:15px;color:#cfcfcb;letter-spacing:.02em;}
  #veil .dots span{display:inline-block;animation:bd 1.1s infinite;}
  #veil .dots span:nth-child(2){animation-delay:.18s;} #veil .dots span:nth-child(3){animation-delay:.36s;}
  @keyframes bd{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
  .result .rh{text-align:center;margin:6px 0 20px;}
  .result .rh .rt{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:#8f8f8c;letter-spacing:.08em;}
  .result .rh h2{font-size:24px;font-weight:900;letter-spacing:-.025em;margin:10px 0 0;word-break:keep-all;}
  .result .rh h2 .w{display:inline-block;opacity:0;transform:translateY(12px);animation:wordin .5s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes wordin{to{opacity:1;transform:none;}}
  .rec{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:11px;opacity:0;transform:translateY(16px);animation:recin .5s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes recin{to{opacity:1;transform:none;}}
  .rec.key{background:var(--ink);color:#0a0a0a;border-color:transparent;}
  .rec.key.glow{animation:recin .5s cubic-bezier(.22,1,.36,1) forwards, keyglow 2.4s ease .5s 1;}
  @keyframes keyglow{0%{box-shadow:0 0 0 0 rgba(255,255,255,0);}25%{box-shadow:0 0 42px 2px rgba(255,255,255,.4);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
  .rec .num{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;flex:0 0 auto;margin-top:2px;color:#8f8f8c;}
  .rec.key .num{color:#555;}
  .rec h3{font-size:17px;font-weight:800;margin:0;}
  .rec p{font-size:13.5px;line-height:1.65;margin:5px 0 0;color:#a9a9a5;word-break:keep-all;}
  .rec.key p{color:#333;}
  .rec.note{background:none;border:1px dashed rgba(255,255,255,.18);}
  .rec.note h3{color:#cfcfcb;}
  .rec.soft{background:linear-gradient(180deg,rgba(255,255,255,.045),var(--card));border:1px solid rgba(255,255,255,.2);}
  .rec.soft .num{color:#cfcfcb;font-weight:700;}
  .closing{text-align:center;font-size:15px;color:#dcdcd8;font-weight:600;margin:22px 0 2px;opacity:0;animation:recin .6s ease forwards;word-break:keep-all;}
  .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 12px;opacity:0;animation:recin .6s ease forwards;}
  .cta a{text-decoration:none;font-size:14.5px;font-weight:700;border-radius:12px;padding:13px 22px;}
  .cta .p{background:var(--ink);color:#0a0a0a;}
  .cta .s{border:1px solid var(--line);color:#ededea;}
  .restart{display:block;margin:4px auto 0;background:none;border:0;color:#6d6d6a;font-size:13px;cursor:pointer;font-family:inherit;padding:8px;opacity:0;animation:recin .6s ease forwards;}
  .mini{position:relative;z-index:1;font-size:12px;color:#7a7a77;margin:18px auto 80px;text-align:center;line-height:1.7;word-break:keep-all;max-width:460px;}
  footer{position:relative;z-index:1;border-top:1px solid var(--line);}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:28px 22px;color:var(--muted);font-size:13px;max-width:860px;}
  #intro{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;text-align:center;}
  #intro p{font-size:clamp(20px,5vw,30px);font-weight:800;letter-spacing:-.02em;color:#f3f3f0;opacity:0;animation:introseq 2.6s ease forwards;word-break:keep-all;}
  @keyframes introseq{0%{opacity:0;transform:translateY(10px);}22%{opacity:1;transform:none;}72%{opacity:1;transform:translateY(-4px);}100%{opacity:0;transform:translateY(-10px);}}
  /* 모바일 최적화: 좁은 화면에서 좌측 여백·척추 정렬·가로 스크롤 방지 */
  @media(max-width:420px){
    .wrap{padding:0 16px;}
    .top .wrap{height:58px;}
    .hero{padding:38px 0 2px;}
    #stage{padding:22px 0 10px;}
    #spine{left:8px;}
    .rung{padding:11px 13px 11px 34px;}
    .rung::before{left:3px;width:15px;height:15px;margin-top:-7.5px;}
    .ask{margin-left:18px;padding:22px 18px;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
    .ask::before{left:-14px;}
    .ask h2{font-size:19.5px;}
    .opt{font-size:15px;padding:14px 15px;}
    .result .rh h2{font-size:22px;}
    .cta a{flex:1;text-align:center;padding:13px 12px;}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    #intro{display:none;} #spineFill{height:calc(var(--p)*100%);}
    .rec,.result .rh h2 .w,.closing,.cta,.restart{opacity:1;transform:none;}
  }
</style>
<script src="analytics.js" defer></script>
</head>
<body>
<div id="bg"></div>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html">김가경 국어 <b>· MEXX</b></a>
  <a class="back" href="index.html">← 홈으로</a>
</div></header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow"><span class="dot"></span> 예비 고2 겨울 안내</span>
    <h1><span class="nb">학생에게 필요한</span> <span class="nb">겨울 강의 찾기</span></h1>
    <p class="sub">간단한 질문을 하나씩 따라 내려오시면, 겨울에 무엇을 준비하면 좋을지 나옵니다.</p>
  </section>
  <div id="stage">
    <div id="spine"><div id="spineFill"></div></div>
    <div id="flow"></div>
  </div>
  <p class="mini">큰 방향을 잡기 위한 안내입니다. 학생의 학교와 성적, 학습 이력에 따라 결과가 달라질 수 있으니 마지막은 상담으로 확인해 주세요.</p>
</main>

<footer><div class="wrap">
  <span>김가경 국어 · MEXX</span>
  <a href="https://pf.kakao.com/_xlgSXX/chat" target="_blank" rel="noopener" style="text-decoration:none;color:#cfcfcb;">카카오톡 문의 →</a>
</div></footer>

<div id="veil"><div style="text-align:center"><div class="vt">학생의 겨울을 짚어보는 중<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div></div>
<div id="intro"><p>이번 겨울은 달라야 합니다.</p></div>

<script>
(function(){
  var KAKAO='https://pf.kakao.com/_xlgSXX/chat';
  var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function track(n,p){ if(window.gtag){ window.gtag('event',n,p||{}); } }

  var Q={
    suneung:{ n:'질문 1', q:'이번 겨울, 수능과 모의고사까지 준비해야 하나요?', short:'수능 준비',
      opts:[{label:'네, 수능까지 준비해요', val:'yes', a:'수능까지', next:'subj'},
            {label:'내신 위주예요', d:'(지금은 수능 비중이 낮아요)', val:'no', a:'내신 위주', next:'subj'}]},
    subj:{ n:'질문 2', q:'2학년 1학기 내신 국어 과목이 무엇인가요?', short:'1학기 과목',
      opts:[{label:'문학', val:'munhak', a:'문학', next:'gaenyeom'},
            {label:'독서와 작문', val:'dokjak', a:'독서와 작문', next:'grammar'},
            {label:'화법과 언어', val:'hwaeon', a:'화법과 언어', next:'grammar'},
            {label:'아직 모르겠어요', val:'unknown', a:'아직 모름', next:'grammar'}]},
    gaenyeom:{ n:'질문 3', q:'문학개념어를 끝까지 들어, 개념이 정리돼 있나요?', hint:'예비 고1~고1 과정에서 한 바퀴 돌렸는지로 보시면 됩니다.', short:'문학개념어',
      opts:[{label:'네, 정리돼 있어요', val:'yes', a:'정리됨', next:'grammar'},
            {label:'아니요, 아직이에요', val:'no', a:'아직', next:'grammar'}]},
    grammar:{ n:'마지막 질문', q:'고1 1년 동안 현대문법이 ‘큰 틀에서’ 정리돼 있나요?', hint:'시험 때마다 급히 외운 게 아니라, 전체 체계가 잡혀 있는지를 보시면 됩니다.', short:'현대문법',
      opts:[{label:'네, 큰 틀이 잡혀 있어요', val:'yes', a:'잡혀 있음', next:'RESULT'},
            {label:'시험 때만 했어요', d:'(큰 틀은 아직이에요)', val:'no', a:'큰 틀은 아직', next:'RESULT'}]}
  };
  var ORDER=['suneung','subj','gaenyeom','grammar'];

  var flow=document.getElementById('flow');
  var answers={}, path=[], current='suneung', busy=false;
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  var CHK='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:8px;top:50%;margin-top:-6px"><path d="M20 6 9 17l-5-5"/></svg>';

  function progress(){
    var depth = current==='RESULT' ? 1 : (path.length/(ORDER.length+1));
    document.documentElement.style.setProperty('--p', depth.toFixed(3));
  }

  function render(){
    flow.innerHTML='';
    path.forEach(function(id){
      var qq=Q[id], ans=answers[id];
      var opt=qq.opts.filter(function(o){return o.val===ans;})[0];
      var rung=el('div','rung');
      rung.innerHTML=CHK+'<span class="rq">'+qq.short+'</span><span class="ra">'+(opt?opt.a:'')+'</span><span class="redo">수정</span>';
      rung.addEventListener('click',function(){
        if(busy)return;
        var i=path.indexOf(id);
        path=path.slice(0,i);
        var keep={}; path.forEach(function(p){keep[p]=answers[p];}); answers=keep;
        current=id; render();
      });
      flow.appendChild(rung);
    });
    if(current==='RESULT'){ renderResult(); }
    else{ renderAsk(current); }
    progress();
    var last=flow.lastChild;
    if(last&&last.scrollIntoView){ try{ last.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'}); }catch(e){} }
  }

  function renderAsk(id){
    var qq=Q[id];
    var box=el('div','ask enter');
    box.innerHTML='<div class="qn">'+qq.n+'</div><h2>'+qq.q+'</h2>'+(qq.hint?'<p class="hint">'+qq.hint+'</p>':'');
    var opts=el('div','opts');
    qq.opts.forEach(function(o){
      var b=el('button','opt');
      b.innerHTML='<span>'+o.label+(o.d?' <span class="od">'+o.d+'</span>':'')+'</span><span class="ar">→</span>';
      b.addEventListener('click',function(){
        if(busy)return; busy=true;
        b.classList.add('chosen'); opts.classList.add('collapsing');
        var go=function(){
          answers[id]=o.val;
          if(path.indexOf(id)<0) path.push(id);
          current=o.next;
          if(current==='RESULT'){ reveal(); } else { busy=false; render(); }
        };
        if(RM){ go(); } else { box.classList.add('leaving'); setTimeout(go,360); }
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
    flow.appendChild(box);
  }

  function reveal(){
    progress();
    var veil=document.getElementById('veil');
    if(RM){ render(); busy=false; return; }
    veil.classList.add('on');
    setTimeout(function(){
      render();
      veil.classList.remove('on');
      busy=false;
      try{ flow.lastChild.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
    },760);
  }

  function renderResult(){
    track('finder_result',{suneung:answers.suneung||'',subj:answers.subj||'',gaenyeom:answers.gaenyeom||'',grammar:answers.grammar||''});
    var recs=[], notes=[];
    var sun=(answers.suneung==='yes'), subj=answers.subj;
    var gaenyeomNeed=(subj==='munhak'&&answers.gaenyeom==='no');
    var grammarNeed=(answers.grammar==='no');
    var hwaeonRetouch=(subj==='hwaeon'&&!grammarNeed);
    var anyTodo=(gaenyeomNeed||grammarNeed||hwaeonRetouch);
    var single=(sun&&!anyTodo);

    if(sun){
      var sp;
      if(single){
        if(subj==='munhak') sp='문학개념어도 문법도 정리돼 있으니, 겨울은 수능 공부에 집중할 시기입니다. 1학기가 문학이니, 문학을 중심으로 수능 공부를 이어 가셔도 좋습니다.';
        else if(subj==='dokjak') sp='문법이 정리돼 있고 지금 급한 과제가 없으니, 겨울은 수능 공부에 집중할 시기입니다. 1학기가 독서와 작문이니, 독서를 중심으로 수능 공부를 이어 가셔도 좋습니다.';
        else sp='지금 급한 과제가 없으니, 겨울은 수능 공부에 집중할 시기입니다. 1학기 과목이 정해지면 그에 맞춰 세부 방향을 잡아 드립니다.';
      }else sp='모의고사와 수능을 함께 준비합니다. 겨울 공부의 기본 축이고, 지금 수강생은 1등급부터 4등급까지 모두 무리 없이 따라오고 있습니다.';
      recs.push({key:true,t:'우리들의 첫 수능 국어',p:sp});
    }
    if(gaenyeomNeed) recs.push({t:'문학개념어',p:'1학기 문학을 준비하려면 개념어부터 잡아야 합니다. 겨울에 완성해 두면 1학기 내내 든든합니다.'});
    else if(!single){
      if(subj==='munhak') notes.push({note:true,t:'문학개념어는 다시 들을 필요가 없습니다',p:'개념어가 이미 정리돼 있습니다.'});
      else notes.push({note:true,t:'문학개념어는 아직 급하지 않습니다',p:'1학기에 문학을 배울 때 준비하면 됩니다.'});
    }
    if(grammarNeed) recs.push({t:'현대문법 가뿐하게, 경쾌하게!',p:'그때그때 시험만 치렀다면 큰 틀이 비어 있기 쉽습니다. 겨울에 품사부터 음운까지 한 번에 체계로 정리해 두면 2학기 ‘화법과 언어’ 문법까지 함께 가져갈 수 있습니다.'});
    else if(hwaeonRetouch) recs.push({t:'현대문법 가뿐하게, 경쾌하게!',p:'문법의 큰 틀은 잡혀 있지만, 2학기 ‘화법과 언어’는 문법 범위가 매우 넓습니다. 겨울에 한 번 더 정리해 두면 2학기가 한결 수월합니다.'});
    else if(!single) notes.push({note:true,t:'문법 수업은 필요하지 않습니다',p:'이미 큰 틀이 잡혀 있습니다.'});
    var suggestDokseo=(!sun&&!grammarNeed&&!gaenyeomNeed);
    if(suggestDokseo) recs.push({soft:true,t:'우리들의 첫 수능 국어',p:'지금 당장 급한 국어 과제는 없습니다. 다만 독해력은 내신 공부만으로는 좀처럼 자라지 않습니다. 겨울에 독서 중심의 수능 공부로 읽는 힘을 미리 다져 두면, 2학년 내내 국어 전체를 떠받치는 바탕이 됩니다. 여유가 되신다면 함께 고려해 보셔도 좋습니다.'});

    var all=recs.concat(notes);
    var hasStrong=recs.some(function(r){return !r.soft;});
    var heading = hasStrong?'이번 겨울, 이 강의를 추천합니다' : suggestDokseo?'지금 꼭 필요한 강의는 없지만, 이런 선택도 있습니다' : '지금 꼭 필요한 겨울 강의는 뚜렷하지 않습니다';

    var box=el('div','result');
    var words=heading.split(' ').map(function(w,i){return '<span class="w" style="animation-delay:'+(0.15+i*0.08).toFixed(2)+'s">'+w+'</span>';}).join(' ');
    box.appendChild(el('div','rh','<div class="rt">이렇게 준비하면 좋습니다</div><h2>'+words+'</h2>'));
    var i=1, base=0.15+heading.split(' ').length*0.08+0.1;
    all.forEach(function(r,idx){
      var c=el('div','rec'+(r.key?' key glow':'')+(r.note?' note':'')+(r.soft?' soft':''));
      c.style.animationDelay=(base+idx*0.14).toFixed(2)+'s';
      var num=r.note?'·':(r.soft?'＋':('0'+(i++)));
      c.innerHTML='<span class="num">'+num+'</span><div><h3>'+r.t+'</h3><p>'+r.p+'</p></div>';
      box.appendChild(c);
    });
    var tail=(base+all.length*0.14+0.15).toFixed(2);
    var cl=el('p','closing','학생의 겨울은, 지금 정해집니다.'); cl.style.animationDelay=tail+'s'; box.appendChild(cl);
    var cta=el('div','cta'); cta.style.animationDelay=(parseFloat(tail)+0.12).toFixed(2)+'s';
    cta.innerHTML='<a class="p" id="rk" href="'+KAKAO+'" target="_blank" rel="noopener">상담으로 확인하기</a><a class="s" href="index.html#winter">겨울 강좌 보기</a>';
    box.appendChild(cta);
    var rs=el('button','restart','처음부터 다시 하기'); rs.style.animationDelay=(parseFloat(tail)+0.24).toFixed(2)+'s';
    rs.addEventListener('click',function(){ answers={}; path=[]; current='suneung'; busy=false; render(); });
    box.appendChild(rs);
    flow.appendChild(box);
    var rk=document.getElementById('rk'); if(rk) rk.addEventListener('click',function(){track('finder_kakao_click');});
  }

  function start(){ track('finder_open'); render(); }
  if(RM){ document.getElementById('intro').style.display='none'; start(); }
  else{
    start();
    setTimeout(function(){ var it=document.getElementById('intro'); if(it) it.parentNode.removeChild(it); }, 2650);
  }
})();
</script>
</body>
