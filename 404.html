<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet"/>

<style>
  :root{--bg:#060607;--ink:#f6f6f4;--muted:#8f8f8c;--line:rgba(255,255,255,.1);--card:#0c0d11}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR",sans-serif;word-break:keep-all;padding:24px}
  .box{max-width:520px;text-align:center}
  .num{font-size:15px;letter-spacing:.3em;color:var(--muted);margin-bottom:18px}
  h1{font-size:clamp(26px,5vw,36px);font-weight:800;line-height:1.35;margin-bottom:14px}
  p{color:var(--muted);line-height:1.7;margin-bottom:32px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px}
  a.main{background:var(--ink);color:var(--bg)}
  a.sub{border:1px solid var(--line);color:var(--ink);background:var(--card)}
  a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main class="box">
  <div class="num">404</div>
  <h1>찾으시는 페이지가<br/>없거나 옮겨졌습니다.</h1>
  <p>지난 강좌의 안내 페이지일 수 있습니다.<br/>지금 신청받는 강좌는 강좌 안내에서 확인하실 수 있습니다.</p>
  <div class="row">
    <a class="btn main" href="/courses.html">지금 강좌 보기</a>
    <a class="btn sub" href="/">처음으로</a>
    <a class="btn sub" href="https://pf.kakao.com/_xlgSXX/chat" target="_blank" rel="noopener">카카오톡 상담</a>
  </div>
</main>
</body>
</html>
